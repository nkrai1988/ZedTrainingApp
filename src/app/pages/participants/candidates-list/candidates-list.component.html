<div class="p-4 sm:p-6">

  <!-- Page Header -->
  <div class="mb-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
    <div>
      <h2 class="text-xl font-semibold text-gray-800">Candidates / Professionals</h2>
      <p class="text-sm text-gray-500 mt-0.5">Registered assessors and consultants</p>
    </div>
    <span class="text-sm text-gray-500">Total: <strong class="text-gray-700">{{ totalCount }}</strong></span>
  </div>

  <!-- Filters -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-4 mb-5">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Applying For</label>
        <select [(ngModel)]="filter.applyingFor"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
          <option value="">All</option>
          <option *ngFor="let opt of applyingForOptions.slice(1)" [value]="opt">{{ opt }}</option>
        </select>
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Org Partner ID</label>
        <input type="text" [(ngModel)]="filter.orgPartnerId" placeholder="Filter by partner"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Search</label>
        <input type="text" [(ngModel)]="filter.searchText" placeholder="Name, email..."
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300" />
      </div>

      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">Status</label>
        <select [(ngModel)]="filter.isBlocked"
          class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-300">
          <option [ngValue]="false">Active</option>
          <option [ngValue]="true">Blocked</option>
        </select>
      </div>

    </div>
    <div class="mt-3 flex gap-2">
      <button (click)="applyFilters()"
        class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition">
        Search
      </button>
      <button (click)="resetFilters()"
        class="border border-gray-300 hover:bg-gray-50 text-gray-600 text-sm font-medium px-4 py-2 rounded-lg transition">
        Reset
      </button>
    </div>
  </div>

  <!-- Error -->
  <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-50 border border-red-200 text-red-600 rounded-lg text-sm">
    {{ errorMessage }}
  </div>

  <!-- Table -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">

    <!-- Loading -->
    <div *ngIf="loading" class="p-8 text-center text-gray-400 text-sm">Loading candidates...</div>

    <!-- Empty -->
    <div *ngIf="!loading && candidates.length === 0 && !errorMessage"
      class="p-8 text-center text-gray-400 text-sm">
      No candidates found.
    </div>

    <!-- Data table (dynamic columns from SP) -->
    <div *ngIf="!loading && candidates.length > 0" class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead class="bg-gray-50 border-b border-gray-200">
          <tr>
            <th *ngFor="let col of columnKeys"
              class="px-4 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide whitespace-nowrap">
              {{ col }}
            </th>
          </tr>
        </thead>
        <tbody class="divide-y divide-gray-100">
          <tr *ngFor="let row of candidates" class="hover:bg-gray-50 transition">
            <td *ngFor="let col of columnKeys"
              class="px-4 py-3 text-gray-700 whitespace-nowrap">
              <span *ngIf="col.toLowerCase().includes('block')"
                [class]="row[col] ? 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-700' : 'inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-700'">
                {{ row[col] ? 'Blocked' : 'Active' }}
              </span>
              <span *ngIf="!col.toLowerCase().includes('block')">
                {{ formatValue(row[col]) }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div *ngIf="!loading && totalPages > 1"
      class="flex items-center justify-between px-4 py-3 border-t border-gray-100 bg-gray-50">
      <p class="text-xs text-gray-500">
        Page {{ filter.page }} of {{ totalPages }} &nbsp;·&nbsp; {{ totalCount }} total
      </p>
      <div class="flex items-center gap-1">
        <button (click)="goToPage(filter.page - 1)" [disabled]="filter.page === 1"
          class="px-3 py-1.5 text-xs font-medium border border-gray-300 rounded-lg disabled:opacity-40 hover:bg-gray-100 transition">
          Prev
        </button>
        <ng-container *ngFor="let p of [].constructor(totalPages > 7 ? 7 : totalPages); let i = index">
          <button (click)="goToPage(i + 1)"
            [class]="'px-3 py-1.5 text-xs font-medium rounded-lg transition ' +
              (filter.page === i + 1 ? 'bg-blue-600 text-white' : 'border border-gray-300 hover:bg-gray-100')">
            {{ i + 1 }}
          </button>
        </ng-container>
        <button (click)="goToPage(filter.page + 1)" [disabled]="filter.page === totalPages"
          class="px-3 py-1.5 text-xs font-medium border border-gray-300 rounded-lg disabled:opacity-40 hover:bg-gray-100 transition">
          Next
        </button>
      </div>
    </div>

  </div>
</div>
