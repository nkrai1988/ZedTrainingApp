<app-auth-page-layout>
  <div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
    <div class="text-center">

      <!-- Loading -->
      @if (status === 'loading') {
        <div class="mb-6 flex justify-center">
          <div class="w-16 h-16 border-4 border-brand-200 border-t-brand-600 rounded-full animate-spin"></div>
        </div>
        <h1 class="mb-2 text-xl font-semibold text-gray-800 dark:text-white/90">
          Verifying your email...
        </h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Please wait a moment.</p>
      }

      <!-- Success -->
      @if (status === 'success') {
        <div class="mb-6 flex justify-center">
          <span class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-success-50 dark:bg-success-500/15">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" class="text-success-600 dark:text-success-400">
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm4.707 7.293a1 1 0 0 0-1.414 0L10.5 14.086l-1.793-1.793a1 1 0 0 0-1.414 1.414l2.5 2.5a1 1 0 0 0 1.414 0l5.5-5.5a1 1 0 0 0 0-1.414z"
                fill="currentColor"/>
            </svg>
          </span>
        </div>
        <h1 class="mb-2 text-xl font-semibold text-gray-800 dark:text-white/90">Email Verified!</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">{{ message }}</p>
        <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">
          Redirecting to sign in in <span class="font-semibold text-brand-600">{{ countdown }}</span> second{{ countdown !== 1 ? 's' : '' }}...
        </p>
        <button
          (click)="goToSignIn()"
          class="w-full px-4 py-2.5 text-sm font-medium text-white bg-brand-600 rounded-lg hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors">
          Sign In Now
        </button>
      }

      <!-- Error -->
      @if (status === 'error') {
        <div class="mb-6 flex justify-center">
          <span class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-error-50 dark:bg-error-500/15">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" class="text-error-600 dark:text-error-400">
              <path fill-rule="evenodd" clip-rule="evenodd"
                d="M12 2C6.477 2 2 6.477 2 12s4.477 10 10 10 10-4.477 10-10S17.523 2 12 2zm-1 5a1 1 0 1 1 2 0v5a1 1 0 1 1-2 0V7zm1 9a1 1 0 1 0 0 2 1 1 0 0 0 0-2z"
                fill="currentColor"/>
            </svg>
          </span>
        </div>
        <h1 class="mb-2 text-xl font-semibold text-gray-800 dark:text-white/90">Verification Failed</h1>
        <p class="text-sm text-gray-600 dark:text-gray-400 mb-6">{{ message }}</p>
        <div class="flex flex-col gap-3">
          <button
            (click)="goToSignUp()"
            class="w-full px-4 py-2.5 text-sm font-medium text-white bg-brand-600 rounded-lg hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-colors">
            Register Again
          </button>
          <button
            (click)="goToSignIn()"
            class="w-full px-4 py-2.5 text-sm font-medium text-gray-700 bg-gray-100 rounded-lg hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 transition-colors">
            Already verified? Sign In
          </button>
        </div>
      }

    </div>
  </div>
</app-auth-page-layout>
