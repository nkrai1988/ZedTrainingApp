<div class="grid grid-cols-12 gap-4 md:gap-6">

  <!-- Filter Card -->
  <div class="col-span-12">
    <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-2xl p-5">
      <div class="flex items-end gap-4">

        <!-- State -->
        <div class="flex-1">
          <p class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase tracking-widest mb-2">Select State</p>
          <app-select
            [options]="allstates"
            placeholder="All States & Territories"
            [value]="stateSelectedValue"
            (valueChange)="handleStateSelectChange($event)"
            className="dark:bg-dark-900"
          ></app-select>
        </div>

<!-- Apply Filters -->
        <button
          (click)="applyFilters()"
          class="flex items-center gap-2 px-5 h-11 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-lg transition-colors whitespace-nowrap shrink-0">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
            <path d="M3 6h18M6 12h12M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Apply Filters
        </button>

      </div>
    </div>
  </div>

  <!-- Metrics Cards -->
  <div class="col-span-12">
    <app-ecommerce-metrics
      [dataLoadProgress]="dataLoadProgress"
      [programmeCount]="ProgrammeNumber"
      [participantCount]="ParticipantNumber"
    />
  </div>

  <!-- Map -->
  <div class="col-span-12" *ngIf="loadMap">
    <app-demographic-card [allLocation]="locationData"/>
  </div>

</div>
