
<div class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-white/[0.05] dark:bg-white/[0.03]">

  <!-- Header bar -->
  <div class="flex flex-col gap-3 px-6 py-5 sm:flex-row sm:items-center sm:justify-between bg-white dark:bg-transparent border-b border-gray-100 dark:border-white/[0.05]">
    <h3 class="text-lg font-bold text-gray-900 dark:text-white">
      Programme Details - {{programmeId}}
    </h3>
    <div class="flex flex-wrap items-center gap-3">
      <a *ngIf="programmeInfo?.programmeSchedule"
         [href]="programmeInfo.programmeSchedule"
         target="_blank"
         class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        Download Programme Schedule
      </a>
      <button (click)="exportExcel()" [disabled]="exportingExcel"
        class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg transition-colors disabled:opacity-60 disabled:cursor-not-allowed">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
        </svg>
        {{ exportingExcel ? 'Exporting...' : 'Download Excel' }}
      </button>
    </div>
  </div>


<div class="flex items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
  <button
    (click)="setSelected('Venue')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Venue')"
  >
    Venue
  </button>

  <button
    (click)="setSelected('Participants')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Participants')"
  >
    Participants
  </button>

  <button
    (click)="setSelected('Monitoring')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Monitoring')"
  >
    Monitoring
  </button>
  <button
    (click)="setSelected('Attendance')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Attendance')"
  >
    Attendance
  </button>
  <button
    (click)="setSelected('Trainers')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Trainers')"
  >
    Trainers
  </button>
  <button
    (click)="setSelected('Feedback')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('Feedback')"
  >
    Feedback
  </button>
</div>
<div *ngIf="selected=='Venue'">
<app-batch-venue [batchId]="programmeId" (venueLoaded)="onVenueLoaded($event)"> </app-batch-venue>
</div>
<div *ngIf="selected=='Participants'">
<app-batch-participants [batchId]="programmeId"> </app-batch-participants>
</div>

<app-batch-monitoring [batchId]="programmeId" *ngIf="selected=='Monitoring'"> </app-batch-monitoring>
<app-batch-attendance [batchId]="programmeId" *ngIf="selected=='Attendance'"> </app-batch-attendance>
<app-batch-trainers [batchId]="programmeId" *ngIf="selected=='Trainers'"> </app-batch-trainers>
<app-batch-feedback [batchId]="programmeId" *ngIf="selected=='Feedback'"> </app-batch-feedback>
