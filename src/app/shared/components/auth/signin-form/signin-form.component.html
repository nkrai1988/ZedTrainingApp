
<div class="flex flex-col min-h-screen bg-white">

  <!-- Card area -->
  <div class="flex flex-col flex-1 items-center justify-center px-6 py-10">

    <!-- Error alert -->
    <div *ngIf="errormessage" class="w-full max-w-lg mb-4">
      <app-alert variant="error" title="Error Message" [message]="errormessage" [showLink]="false" />
    </div>

    <!-- Login card -->
    <div class="w-full max-w-lg rounded-2xl shadow-lg overflow-hidden">

      <!-- Dark teal header -->
      <div class="bg-[#0b2b38] px-8 py-8 text-center">
        <p class="text-white/70 text-sm mb-2">Training &amp; Capacity Building Module</p>
        <h1 class="text-white text-3xl font-bold mb-2">Welcome!</h1>
        <p class="text-white/70 text-sm">Enter your email and password to &nbsp;sign in !</p>
      </div>

      <!-- Form body -->
      <div class="bg-[#eaf0f6] px-8 py-8">
        <form (ngSubmit)="onSignIn()" [formGroup]="signinForm" class="space-y-5">

          <!-- Username -->
          <div>
            <app-label>Username <span class="text-error-500">*</span></app-label>
            <input
              type="text"
              formControlName="email"
              name="email"
              placeholder="Enter User Name"
              class="h-11 w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-800 placeholder:text-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:border-brand-300 focus:ring-brand-500/20"
            />
            <p
              *ngIf="signinForm.get('email')?.invalid && (signinForm.get('email')?.touched || signinForm.get('email')?.dirty)"
              class="mt-1.5 text-xs text-error-500"
            >Username is required</p>
          </div>

          <!-- Password -->
          <div>
            <app-label>Password</app-label>
            <div class="relative">
              <input
                formControlName="password"
                [type]="showPassword ? 'text' : 'password'"
                name="password"
                placeholder="Enter your password"
                class="h-11 w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 pr-11 text-sm text-gray-800 placeholder:text-gray-400 shadow-sm focus:outline-none focus:ring-2 focus:border-brand-300 focus:ring-brand-500/20"
              />
              <span
                (click)="togglePasswordVisibility()"
                class="absolute z-30 -translate-y-1/2 cursor-pointer right-4 top-1/2"
              >
                @if (showPassword) {
                  <svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="fill-gray-500 size-5"><path fill-rule="evenodd" clip-rule="evenodd" d="M10.0002 13.8619C7.23361 13.8619 4.86803 12.1372 3.92328 9.70241C4.86804 7.26761 7.23361 5.54297 10.0002 5.54297C12.7667 5.54297 15.1323 7.26762 16.0771 9.70243C15.1323 12.1372 12.7667 13.8619 10.0002 13.8619ZM10.0002 4.04297C6.48191 4.04297 3.49489 6.30917 2.4155 9.4593C2.3615 9.61687 2.3615 9.78794 2.41549 9.94552C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C13.5184 15.3619 16.5055 13.0957 17.5849 9.94555C17.6389 9.78797 17.6389 9.6169 17.5849 9.45932C16.5055 6.30919 13.5184 4.04297 10.0002 4.04297ZM9.99151 7.84413C8.96527 7.84413 8.13333 8.67606 8.13333 9.70231C8.13333 10.7286 8.96527 11.5605 9.99151 11.5605H10.0064C11.0326 11.5605 11.8646 10.7286 11.8646 9.70231C11.8646 8.67606 11.0326 7.84413 10.0064 7.84413H9.99151Z"></path></svg>
                } @else {
                  <svg width="1em" height="1em" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="fill-gray-500 size-5"><path fill-rule="evenodd" clip-rule="evenodd" d="M4.63803 3.57709C4.34513 3.2842 3.87026 3.2842 3.57737 3.57709C3.28447 3.86999 3.28447 4.34486 3.57737 4.63775L4.85323 5.91362C3.74609 6.84199 2.89363 8.06395 2.4155 9.45936C2.3615 9.61694 2.3615 9.78801 2.41549 9.94558C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C11.255 15.3619 12.4422 15.0737 13.4994 14.5598L15.3625 16.4229C15.6554 16.7158 16.1302 16.7158 16.4231 16.4229C16.716 16.13 16.716 15.6551 16.4231 15.3622L4.63803 3.57709ZM12.3608 13.4212L10.4475 11.5079C10.3061 11.5423 10.1584 11.5606 10.0064 11.5606H9.99151C8.96527 11.5606 8.13333 10.7286 8.13333 9.70237C8.13333 9.5461 8.15262 9.39434 8.18895 9.24933L5.91885 6.97923C5.03505 7.69015 4.34057 8.62704 3.92328 9.70247C4.86803 12.1373 7.23361 13.8619 10.0002 13.8619C10.8326 13.8619 11.6287 13.7058 12.3608 13.4212ZM16.0771 9.70249C15.7843 10.4569 15.3552 11.1432 14.8199 11.7311L15.8813 12.7925C16.6329 11.9813 17.2187 11.0143 17.5849 9.94561C17.6389 9.78803 17.6389 9.61696 17.5849 9.45938C16.5055 6.30925 13.5184 4.04303 10.0002 4.04303C9.13525 4.04303 8.30244 4.17999 7.52218 4.43338L8.75139 5.66259C9.1556 5.58413 9.57311 5.54303 10.0002 5.54303C12.7667 5.54303 15.1323 7.26768 16.0771 9.70249Z"></path></svg>
                }
              </span>
            </div>
            <p
              *ngIf="signinForm.get('password')?.invalid && (signinForm.get('password')?.touched || signinForm.get('password')?.dirty)"
              class="mt-1.5 text-xs text-error-500"
            >Password is required</p>
          </div>

          <!-- Remember me + Forget Password -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer select-none">
              <input
                type="checkbox"
                [(ngModel)]="isChecked"
                [ngModelOptions]="{standalone: true}"
                class="w-4 h-4 rounded border-gray-300 cursor-pointer accent-brand-500"
              />
              <span class="text-sm text-gray-600">Remember me</span>
            </label>
            <a routerLink="/reset-password" class="text-sm text-brand-500 hover:text-brand-600">
              Forget Password?
            </a>
          </div>

          <!-- Sign In button -->
          <button
            type="submit"
            class="w-full h-11 rounded-lg bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-medium transition-colors"
          >
            {{ btntext }}
          </button>

        </form>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="pb-6 text-center">
    <p class="text-gray-400 text-sm">Training &amp; Certification Platform &ndash; Version 1.0</p>
  </div>

</div>
