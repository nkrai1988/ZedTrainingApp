<div class="flex items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
  <button
    (click)="setSelected('training')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('training')"
  >
    Training
  </button>

  <button
    (click)="setSelected('professional')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('professional')"
  >
    Professional
  </button>

  <button
    (click)="setSelected('qmp')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('qmp')"
  >
    QMP
  </button>
  <button
    (click)="setSelected('assessor')"
    class="px-3 py-2 font-medium w-full rounded-md text-theme-sm hover:text-gray-900 dark:hover:text-white"
    [ngClass]="getButtonClass('assessor')"
  >
    Assessor
  </button>
</div>
